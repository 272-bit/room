<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>회의실 예약</title>
<style>
  :root {
    --navy: #2c4570;
    --navy-light: #eef2fa;
    --border: #e6e8ec;
    --text: #1a1d24;
    --text-muted: #8b90a0;
    --bg: #f4f5f8;
    --surface: #ffffff;
    --shadow-sm: 0 1px 2px rgba(20,25,40,0.04), 0 1px 6px rgba(20,25,40,0.03);
    --shadow-md: 0 4px 16px rgba(20,25,40,0.08);
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    letter-spacing: -0.1px;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; transition: transform .12s ease, background-color .15s ease, border-color .15s ease, box-shadow .15s ease; }
  button:active { transform: scale(0.97); }

  #app { max-width: 1140px; margin: 0 auto; padding: 20px 20px 64px; }

  /* 이름 선택 화면 */
  #nameScreen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px; padding: 24px; background: var(--bg);
  }
  #nameScreen h1 { font-size: 23px; font-weight: 600; margin: 0; letter-spacing: -0.3px; }
  #nameScreen p { color: var(--text-muted); margin: 0; font-size: 15px; }
  .name-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 440px; }
  .name-btn {
    padding: 26px 0; border-radius: var(--radius-lg); border: none; font-size: 20px; font-weight: 600;
    cursor: pointer; color: #fff; box-shadow: var(--shadow-sm);
  }
  .name-btn:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

  /* 상단 바 */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .user-pill {
    display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 8px 7px 14px;
  }
  .user-dot { width: 15px; height: 15px; border-radius: 50%; }
  .change-user {
    font-size: 12px; color: var(--text-muted); background: var(--bg); border: none; border-radius: 999px;
    cursor: pointer; padding: 5px 12px; font-weight: 500;
  }
  .change-user:hover { color: var(--navy); background: var(--navy-light); }

  .view-tabs { display: flex; gap: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
  .view-tab {
    padding: 7px 20px; border-radius: 999px; border: none; background: transparent;
    font-size: 14px; font-weight: 500; cursor: pointer; color: var(--text-muted);
  }
  .view-tab.active { background: var(--navy); color: #fff; box-shadow: var(--shadow-sm); }

  /* 날짜 네비게이션 */
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .nav-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
    font-size: 18px; cursor: pointer; color: var(--text);
  }
  .nav-btn:hover { border-color: var(--navy); color: var(--navy); }
  .nav-label { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }

  .room-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
  .room-tab {
    padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; color: var(--text-muted);
  }
  .room-tab.active { background: var(--navy-light); border-color: var(--navy); color: var(--navy); font-weight: 600; }

  /* 그리드 */
  .grid-scroll { overflow-x: auto; background: var(--surface); border-radius: var(--radius-md); border: 1px solid var(--border); padding: 16px; box-shadow: var(--shadow-sm); }
  .grid-wrap { min-width: 100%; }
  .col-headers { display: grid; margin-bottom: 6px; }
  .col-header { text-align: center; font-size: 14px; font-weight: 600; padding: 4px 4px 8px; color: var(--text); }
  .col-header .sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }

  .grid-body { display: flex; flex-direction: column; gap: 5px; }
  .segment-grid { display: grid; position: relative; }
  .break-row {
    text-align: center; font-size: 11.5px; font-weight: 500; color: var(--text-muted);
    background: var(--bg); border-radius: 6px; padding: 5px 0; letter-spacing: 0.2px;
  }
  .time-col { position: relative; }
  .time-label { position: absolute; right: 10px; font-size: 12px; color: var(--text-muted); transform: translateY(-50%); }

  .day-col {
    position: relative; border-left: 1px solid var(--border);
    touch-action: none; background-color: var(--surface); border-radius: 4px;
  }
  .day-col:first-of-type { border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm); }
  .day-col:last-child { border-right: 1px solid var(--border); border-top-right-radius: var(--radius-sm); border-bottom-right-radius: var(--radius-sm); }

  .booking-bar {
    position: absolute; left: 3px; right: 3px; border-radius: 8px; padding: 5px 8px;
    font-size: 12.5px; font-weight: 600; overflow: hidden; line-height: 1.35; cursor: pointer;
    box-shadow: 0 1px 3px rgba(20,25,40,0.12);
  }
  .booking-bar:hover { filter: brightness(1.05); }
  .booking-bar .time { display: block; font-size: 10.5px; font-weight: 400; opacity: 0.85; }

  .preview-bar {
    position: absolute; left: 3px; right: 3px; border: 2px dashed var(--navy); border-radius: 8px;
    pointer-events: none; background: rgba(44,69,112,0.08);
  }

  .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 16px; text-align: center; }

  @media (max-width: 480px) {
    #app { padding: 14px 10px 48px; }
    .grid-scroll { padding: 10px 6px; }
    .col-header { font-size: 12px; padding: 2px 2px 6px; }
    .col-header .sub { font-size: 9.5px; }
    .time-label { font-size: 10px; right: 6px; }
    .booking-bar { font-size: 11px; padding: 4px 5px; }
    .booking-bar .time { font-size: 9.5px; }
    .nav-label { font-size: 15px; }
    .topbar { gap: 8px; }
  }
</style>
</head>
<body>

<div id="nameScreen" style="display:none;">
  <h1>회의실 예약</h1>
  <p>본인 이름을 선택하세요</p>
  <div class="name-grid" id="nameGrid"></div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="user-pill">
      <span class="user-dot" id="userDot"></span>
      <span id="userLabel"></span>
      <button class="change-user" id="changeUserBtn">변경</button>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" data-view="day">일간</button>
      <button class="view-tab" data-view="week">주간</button>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="nav-label" id="navLabel"></div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>

  <div id="roomTabsWrap" class="room-tabs" style="display:none;"></div>

  <div class="grid-scroll">
    <div class="grid-wrap">
      <div class="col-headers" id="colHeaders"></div>
      <div class="grid-body" id="gridBody"></div>
    </div>
  </div>

  <p class="hint">빈 공간을 눌러서 아래로 끌면 현재 선택된 본인 이름으로 예약됩니다 (30분 단위). 다른 사람 걸로 등록하려면 위에서 사용자를 먼저 바꾸세요. 예약 막대를 누르면 수정·취소할 수 있습니다.</p>
</div>

<div id="editOverlay" style="display:none; position:fixed; inset:0; background:rgba(20,25,40,0.4); z-index:50; align-items:center; justify-content:center; padding:20px;">
  <div style="background:var(--surface); border-radius:var(--radius-md); padding:20px; width:100%; max-width:360px; box-shadow:var(--shadow-md);">
    <p id="editInfo" style="font-size:14px; color:var(--text-muted); margin:0 0 12px; font-weight:500;"></p>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <input id="editStartInput" type="time" step="1800" min="08:00" max="20:00"
        style="flex:1; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:15px; font-family:inherit;" />
      <span style="align-self:center; color:var(--text-muted);">~</span>
      <input id="editEndInput" type="time" step="1800" min="08:00" max="20:00"
        style="flex:1; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:15px; font-family:inherit;" />
    </div>
    <input id="editMemoInput" type="text" maxlength="30" placeholder="메모 (선택사항)"
      style="width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px; margin-bottom:14px; box-sizing:border-box; font-family:inherit;" />
    <div style="display:flex; gap:8px;">
      <button id="editSaveBtn" style="flex:1; padding:11px; border:none; border-radius:8px; background:var(--navy); color:#fff; font-weight:600; font-size:14px; cursor:pointer;">저장</button>
      <button id="editDeleteBtn" style="flex:1; padding:11px; border:none; border-radius:8px; background:#fbeaea; color:#c0392b; font-weight:600; font-size:14px; cursor:pointer;">예약 취소</button>
    </div>
    <button id="editCancelBtn" style="width:100%; margin-top:6px; padding:9px; border:none; background:none; color:var(--text-muted); font-size:13px; cursor:pointer;">닫기</button>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// SUPABASE_URL, SUPABASE_ANON_KEY는 config.js에서 불러옵니다. (이 파일에서 수정 X)
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const START_HOUR = 8;
const END_HOUR = 20;
const TOTAL_SLOTS = (END_HOUR - START_HOUR) * 2; // 30분 단위
const PPS = 28; // pixels per slot
const GRID_HEIGHT = TOTAL_SLOTS * PPS;

const USERS = [
  { name: 'KJ', bg: '#7F77DD', fg: '#ffffff' },
  { name: 'YG', bg: '#1D9E75', fg: '#ffffff' },
  { name: 'JH', bg: '#D85A30', fg: '#ffffff' },
  { name: 'JR', bg: '#D4537E', fg: '#ffffff' },
  { name: 'HK', bg: '#5F5E5A', fg: '#ffffff' },
  { name: 'SY', bg: '#378ADD', fg: '#ffffff' },
];
const ROOMS = [
  { key: '대회의실', label: '대회의실', sub: '' },
  { key: '접견실', label: '접견실', sub: '' },
  { key: '회의실1', label: '회의실1', sub: '영업 앞' },
  { key: '회의실2', label: '회의실2', sub: '접견실 옆' },
];
// 예약 가능한 시간 구간 (점심/저녁시간 제외)
const SEGMENTS = [
  { startHour: 8, endHour: 12 },
  { startHour: 13, endHour: 17 },
  { startHour: 18, endHour: 20 },
];
const BREAK_AFTER = ['점심시간', '저녁시간', null]; // 각 세그먼트 뒤에 표시할 구분 라벨

function userInfo(name) { return USERS.find(u => u.name === name); }

// ---------- 상태 ----------
let currentUser = localStorage.getItem('roomBookingUser') || null;
let view = 'day'; // 'day' | 'week'
let currentDate = new Date();
let currentRoomIdx = 0; // 주간 뷰에서 선택된 회의실
let bookings = []; // 현재 조회 범위의 예약 목록 (room, start_ts, end_ts, user_name, id)
let realtimeChannel = null;

// ---------- 유틸 ----------
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d) { // 월요일 시작
  const x = startOfDay(d);
  const day = (x.getDay() + 6) % 7; // 월=0
  return addDays(x, -day);
}
function slotToLabel(slot) {
  const totalMin = START_HOUR*60 + slot*30;
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function dateToSlot(dateObj, dayBase) {
  const diffMs = dateObj - dayBase;
  const min = diffMs/60000 - START_HOUR*60;
  return min/30;
}
function slotToDate(dayBase, slot) {
  const totalMin = START_HOUR*60 + slot*30;
  return new Date(dayBase.getTime() + totalMin*60000);
}
function weekdayColor(d) {
  const day = d.getDay();
  if (day === 0) return '#e5484d'; // 일요일 - 빨강
  if (day === 6) return '#4a90d9'; // 토요일 - 연한 파랑
  return null;
}

function fmtDateLabel(d) {
  return new Intl.DateTimeFormat('ko-KR', { month:'long', day:'numeric', weekday:'short' }).format(d);
}

// ---------- 이름 선택 ----------
function renderNameScreen() {
  const grid = document.getElementById('nameGrid');
  grid.innerHTML = '';
  USERS.forEach(u => {
    const b = document.createElement('button');
    b.className = 'name-btn';
    b.textContent = u.name;
    b.style.background = u.bg;
    b.onclick = () => {
      localStorage.setItem('roomBookingUser', u.name);
      currentUser = u.name;
      showApp();
    };
    grid.appendChild(b);
  });
}

function showApp() {
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const u = userInfo(currentUser);
  document.getElementById('userDot').style.background = u.bg;
  document.getElementById('userLabel').textContent = currentUser + '님';
  renderView();
  subscribeRealtime();
}

document.getElementById('changeUserBtn').onclick = () => {
  localStorage.removeItem('roomBookingUser');
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('nameScreen').style.display = 'flex';
};

// ---------- 뷰 전환 ----------
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    document.getElementById('roomTabsWrap').style.display = view === 'week' ? 'flex' : 'none';
    renderView();
  };
});

function renderRoomTabs() {
  const wrap = document.getElementById('roomTabsWrap');
  wrap.innerHTML = '';
  ROOMS.forEach((r, idx) => {
    const b = document.createElement('button');
    b.className = 'room-tab' + (idx === currentRoomIdx ? ' active' : '');
    b.textContent = r.label + (r.sub ? ' (' + r.sub + ')' : '');
    b.onclick = () => { currentRoomIdx = idx; renderView(); };
    wrap.appendChild(b);
  });
}

// ---------- 네비게이션 ----------
document.getElementById('prevBtn').onclick = () => { navigate(-1); };
document.getElementById('nextBtn').onclick = () => { navigate(1); };
function navigate(dir) {
  if (view === 'day') currentDate = addDays(currentDate, dir);
  else currentDate = addDays(currentDate, dir*7);
  renderView();
}

// 스와이프 (그리드 영역 전체, 가로 이동이 우세할 때만 네비게이션으로 처리)
(function setupSwipe(){
  const scrollEl = document.querySelector('.grid-scroll');
  let sx=0, sy=0, tracking=false, decided=null;
  scrollEl.addEventListener('touchstart', e => {
    if (dragState) return; // 예약 드래그 중이면 스와이프 무시
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; decided = null;
  }, {passive:true});
  scrollEl.addEventListener('touchmove', e => {
    if (!tracking || dragState) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (decided === null && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
      decided = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
  }, {passive:true});
  scrollEl.addEventListener('touchend', e => {
    if (!tracking || dragState) { tracking = false; return; }
    const dx = (e.changedTouches[0].clientX - sx);
    if (decided === 'h' && Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
    tracking = false;
  });
})();

// ---------- 렌더링 ----------
function renderView() {
  renderRoomTabs();
  const label = view === 'day'
    ? fmtDateLabel(currentDate)
    : (() => {
        const s = startOfWeek(currentDate), e = addDays(s, 6);
        return fmtDateLabel(s) + ' ~ ' + fmtDateLabel(e);
      })();
  document.getElementById('navLabel').textContent = label;
  document.getElementById('navLabel').style.color = (view === 'day' ? weekdayColor(currentDate) : null) || 'var(--text)';

  const columns = view === 'day'
    ? ROOMS.map(r => ({ key: r.key, title: r.label, sub: r.sub, dayBase: startOfDay(currentDate), room: r.key }))
    : (() => {
        const s = startOfWeek(currentDate);
        const room = ROOMS[currentRoomIdx].key;
        return [0,1,2,3,4,5,6].map(i => {
          const d = addDays(s, i);
          return { key: room+'-'+i, title: fmtDateLabel(d).split(' ').slice(0,2).join(' '), sub: fmtDateLabel(d).split(' ')[2]||'', dayBase: d, room };
        });
      })();

  // 헤더
  const colHeaders = document.getElementById('colHeaders');
  colHeaders.style.gridTemplateColumns = '44px repeat('+columns.length+', minmax(0, 1fr))';
  colHeaders.innerHTML = '<div></div>' + columns.map(c => {
    const color = view === 'week' ? weekdayColor(c.dayBase) : null;
    const titleStyle = color ? ' style="color:'+color+'"' : '';
    return '<div class="col-header"><span'+titleStyle+'>'+c.title+'</span>'+(c.sub ? '<span class="sub"><br>'+c.sub+'</span>' : '')+'</div>';
  }).join('');

  // 바디: 예약 가능 구간(SEGMENTS)별로 나눠서 그리고, 그 사이에 점심/저녁 구분줄 삽입
  const gridBody = document.getElementById('gridBody');
  gridBody.innerHTML = '';
  const segmentsMeta = [];

  SEGMENTS.forEach((seg, idx) => {
    const segSlots = (seg.endHour - seg.startHour) * 2;
    const segHeight = segSlots * PPS;
    const baseSlot = (seg.startHour - START_HOUR) * 2;

    const wrap = document.createElement('div');
    wrap.className = 'segment-grid';
    wrap.style.gridTemplateColumns = '44px repeat('+columns.length+', minmax(0, 1fr))';

    const timeCol = document.createElement('div');
    timeCol.className = 'time-col';
    timeCol.style.height = segHeight + 'px';
    for (let h = seg.startHour; h <= seg.endHour; h++) {
      const slot = (h - seg.startHour) * 2;
      const lab = document.createElement('div');
      lab.className = 'time-label';
      lab.style.top = (slot*PPS) + 'px';
      lab.textContent = String(h).padStart(2,'0') + ':00';
      timeCol.appendChild(lab);
    }
    wrap.appendChild(timeCol);

    const colEls = [];
    columns.forEach(col => {
      const div = document.createElement('div');
      div.className = 'day-col';
      div.style.height = segHeight + 'px';
      div.style.backgroundImage = 'repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px '+(PPS*2)+'px)';
      div.dataset.room = col.room;
      div.dataset.daybase = col.dayBase.getTime();
      div.dataset.baseslot = baseSlot;
      div.dataset.segslots = segSlots;
      wrap.appendChild(div);
      attachDragHandlers(div, col, baseSlot, segSlots);
      colEls.push(div);
    });

    gridBody.appendChild(wrap);
    segmentsMeta.push({ baseSlot, segSlots, colEls });

    const breakLabel = BREAK_AFTER[idx];
    if (breakLabel) {
      const br = document.createElement('div');
      br.className = 'break-row';
      br.textContent = breakLabel;
      gridBody.appendChild(br);
    }
  });

  fetchAndRenderBookings(columns, segmentsMeta);
}

// ---------- 데이터 조회 ----------
async function fetchAndRenderBookings(columns, segmentsMeta) {
  let rangeStart, rangeEnd, roomFilter = null;
  if (view === 'day') {
    rangeStart = startOfDay(currentDate);
    rangeEnd = addDays(rangeStart, 1);
  } else {
    rangeStart = startOfWeek(currentDate);
    rangeEnd = addDays(rangeStart, 7);
    roomFilter = ROOMS[currentRoomIdx].key;
  }
  let query = sb.from('reservations').select('*')
    .lt('start_ts', rangeEnd.toISOString())
    .gt('end_ts', rangeStart.toISOString());
  if (roomFilter) query = query.eq('room', roomFilter);

  const { data, error } = await query;
  if (error) { console.error(error); bookings = []; }
  else bookings = data || [];
  renderBookingBars(segmentsMeta);
}

function renderBookingBars(segmentsMeta) {
  segmentsMeta.forEach(seg => {
    seg.colEls.forEach(colEl => {
      colEl.querySelectorAll('.booking-bar').forEach(el => el.remove());
      const room = colEl.dataset.room;
      const dayBase = new Date(Number(colEl.dataset.daybase));
      const dayEnd = addDays(dayBase, 1);
      const lo = seg.baseSlot, hi = seg.baseSlot + seg.segSlots;
      bookings
        .filter(b => b.room === room)
        .forEach(b => {
          const s = new Date(b.start_ts), e = new Date(b.end_ts);
          if (e <= dayBase || s >= dayEnd) return; // 이 컬럼(날짜) 범위 밖
          const startSlotAbs = Math.max(0, dateToSlot(s < dayBase ? dayBase : s, dayBase));
          const endSlotAbs = Math.min(TOTAL_SLOTS, dateToSlot(e > dayEnd ? dayEnd : e, dayBase));
          const clipStart = Math.max(startSlotAbs, lo);
          const clipEnd = Math.min(endSlotAbs, hi);
          if (clipEnd <= clipStart) return; // 이 구간(세그먼트)과 안 겹침
          const localStart = clipStart - lo, localEnd = clipEnd - lo;
          const u = userInfo(b.user_name);
          const titleLine = escapeHtml(u.name + (b.memo ? ' ' + b.memo : ''));
          const bar = document.createElement('div');
          bar.className = 'booking-bar';
          bar.style.top = (localStart*PPS) + 'px';
          bar.style.height = Math.max(PPS-3, (localEnd-localStart)*PPS-3) + 'px';
          bar.style.background = u.bg;
          bar.style.color = u.fg;
          bar.innerHTML = (endSlotAbs - startSlotAbs <= 1)
            ? titleLine
            : titleLine + '<span class="time">'+ fmtTime(s) +'-'+ fmtTime(e) +'</span>';
          attachBarDragHandlers(bar, b, room, s, e);
          colEl.appendChild(bar);
        });
    });
  });
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- 기존 예약 드래그 이동 ----------
let barDragState = null;

function attachBarDragHandlers(bar, b, room, s, e) {
  const start = (clientX, clientY) => {
    barDragState = { bookingId: b.id, booking: b, room, s, e, startX: clientX, startY: clientY, moved: false, ghost: null };
  };
  bar.addEventListener('mousedown', ev => { ev.stopPropagation(); start(ev.clientX, ev.clientY); });
  bar.addEventListener('touchstart', ev => { ev.stopPropagation(); const t = ev.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
}

function barMove(clientX, clientY) {
  if (!barDragState) return;
  const dx = clientX - barDragState.startX, dy = clientY - barDragState.startY;
  if (!barDragState.moved && Math.hypot(dx, dy) > 8) {
    barDragState.moved = true;
    const ghost = document.createElement('div');
    ghost.textContent = userInfo(barDragState.booking.user_name).name + ' 이동 중';
    ghost.style.cssText = 'position:fixed; pointer-events:none; z-index:100; padding:6px 12px; border-radius:8px; background:var(--navy); color:#fff; font-size:12px; font-weight:600; box-shadow:var(--shadow-md); transform:translate(-50%,-140%);';
    document.body.appendChild(ghost);
    barDragState.ghost = ghost;
  }
  if (barDragState.moved && barDragState.ghost) {
    barDragState.ghost.style.left = clientX + 'px';
    barDragState.ghost.style.top = clientY + 'px';
  }
}
document.addEventListener('mousemove', e => barMove(e.clientX, e.clientY));
document.addEventListener('touchmove', e => { if (barDragState) barMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});

async function barUp(clientX, clientY) {
  if (!barDragState) return;
  const st = barDragState;
  barDragState = null;
  if (st.ghost) st.ghost.remove();

  if (!st.moved) {
    openEditPanel(st.booking, st.room, st.s, st.e);
    return;
  }

  const el = document.elementFromPoint(clientX, clientY);
  const dayColEl = el ? el.closest('.day-col') : null;
  if (!dayColEl) return; // 유효하지 않은 곳에 놓음 - 원래 자리 유지

  const baseSlot = Number(dayColEl.dataset.baseslot);
  const segSlots = Number(dayColEl.dataset.segslots);
  const targetRoom = dayColEl.dataset.room;
  const targetDayBase = new Date(Number(dayColEl.dataset.daybase));
  const durationSlots = Math.round((st.e - st.s) / (30*60000));
  const rect = dayColEl.getBoundingClientRect();
  const rawSlot = Math.round((clientY - rect.top) / PPS);
  const localSlot = Math.max(0, Math.min(segSlots - durationSlots, rawSlot));

  const newStart = slotToDate(targetDayBase, baseSlot + localSlot);
  const newEnd = slotToDate(targetDayBase, baseSlot + localSlot + durationSlots);

  const overlap = bookings.some(b => b.id !== st.bookingId && b.room === targetRoom &&
    newStart < new Date(b.end_ts) && newEnd > new Date(b.start_ts));
  if (overlap) { alert('그 시간대는 이미 예약되어 있습니다.'); return; }

  const { error } = await sb.from('reservations')
    .update({ room: targetRoom, start_ts: newStart.toISOString(), end_ts: newEnd.toISOString() })
    .eq('id', st.bookingId);
  if (error) { alert('이동 실패: ' + error.message); return; }
  renderView();
}
document.addEventListener('mouseup', e => barUp(e.clientX, e.clientY));
document.addEventListener('touchend', e => { const t = e.changedTouches[0]; barUp(t.clientX, t.clientY); });

// ---------- 예약 수정/삭제 모달 ----------
let editingId = null;
let editingRoom = null;
let editingDayBase = null; // 그 날짜의 00:00 (날짜는 안 바꾸고 시간만 수정)

function isInBreak(startDate, endDate) {
  // 08-12, 13-17, 18-20 세그먼트 중 어느 하나에 완전히 포함되지 않으면 점심/저녁시간(또는 운영시간 밖)을 침범한 것
  return !SEGMENTS.some(seg => {
    const segStart = new Date(editingDayBase); segStart.setHours(seg.startHour,0,0,0);
    const segEnd = new Date(editingDayBase); segEnd.setHours(seg.endHour,0,0,0);
    return startDate >= segStart && endDate <= segEnd;
  });
}

function openEditPanel(b, room, s, e) {
  editingId = b.id;
  editingRoom = room;
  editingDayBase = startOfDay(s);
  const u = userInfo(b.user_name);
  document.getElementById('editInfo').textContent = u.name + '님 · ' + room + ' · ' + fmtDateLabel(s);
  document.getElementById('editStartInput').value = fmtTime(s);
  document.getElementById('editEndInput').value = fmtTime(e);
  document.getElementById('editMemoInput').value = b.memo || '';
  document.getElementById('editOverlay').style.display = 'flex';
}
function closeEditPanel() {
  document.getElementById('editOverlay').style.display = 'none';
  editingId = null; editingRoom = null; editingDayBase = null;
}
document.getElementById('editCancelBtn').onclick = closeEditPanel;
document.getElementById('editOverlay').onclick = (e) => {
  if (e.target.id === 'editOverlay') closeEditPanel();
};
document.getElementById('editSaveBtn').onclick = async () => {
  if (!editingId) return;
  const startStr = document.getElementById('editStartInput').value;
  const endStr = document.getElementById('editEndInput').value;
  if (!startStr || !endStr) { alert('시작/종료 시간을 입력해주세요.'); return; }
  const [sh, sm] = startStr.split(':').map(Number);
  const [eh, em] = endStr.split(':').map(Number);
  const newStart = new Date(editingDayBase); newStart.setHours(sh, sm, 0, 0);
  const newEnd = new Date(editingDayBase); newEnd.setHours(eh, em, 0, 0);

  if (newEnd <= newStart) { alert('종료 시간이 시작 시간보다 늦어야 합니다.'); return; }
  if (isInBreak(newStart, newEnd)) { alert('점심시간(12-13시)/저녁시간(17-18시)과 겹치거나 운영시간(08-20시)을 벗어났습니다.'); return; }
  const overlap = bookings.some(b => b.id !== editingId && b.room === editingRoom &&
    newStart < new Date(b.end_ts) && newEnd > new Date(b.start_ts));
  if (overlap) { alert('다른 예약과 시간이 겹칩니다.'); return; }

  const memo = document.getElementById('editMemoInput').value.trim().slice(0, 30);
  const { error } = await sb.from('reservations')
    .update({ memo: memo || null, start_ts: newStart.toISOString(), end_ts: newEnd.toISOString() })
    .eq('id', editingId);
  if (error) { alert('저장 실패: ' + error.message); return; }
  closeEditPanel();
  renderView();
};
document.getElementById('editDeleteBtn').onclick = async () => {
  if (!editingId) return;
  if (!confirm('이 예약을 취소할까요?')) return;
  await deleteBooking(editingId);
  closeEditPanel();
};
function fmtTime(d) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

async function deleteBooking(id) {
  const { error } = await sb.from('reservations').delete().eq('id', id);
  if (error) alert('삭제 실패: ' + error.message);
  renderView();
}

// ---------- 드래그로 예약 생성 ----------
let dragState = null;
let previewEl = null;

function yToSlot(el, clientY, maxSlot) {
  const rect = el.getBoundingClientRect();
  const y = clientY - rect.top;
  return Math.max(0, Math.min(maxSlot, Math.round(y / PPS)));
}

function attachDragHandlers(colEl, colInfo, baseSlot, segSlots) {
  const start = (clientY) => {
    const slot = yToSlot(colEl, clientY, segSlots);
    dragState = { colEl, colInfo, baseSlot, segSlots, startSlot: slot, curSlot: slot };
    previewEl = document.createElement('div');
    previewEl.className = 'preview-bar';
    colEl.appendChild(previewEl);
    updatePreview();
  };
  colEl.addEventListener('mousedown', e => { if (e.target === colEl) start(e.clientY); });
  colEl.addEventListener('touchstart', e => { if (e.target === colEl) start(e.touches[0].clientY); }, {passive:true});
}

function updatePreview() {
  if (!dragState || !previewEl) return;
  const s = Math.min(dragState.startSlot, dragState.curSlot);
  const eRaw = Math.max(dragState.startSlot, dragState.curSlot);
  const e = eRaw === s ? s+1 : eRaw;
  previewEl.style.top = (s*PPS)+'px';
  previewEl.style.height = (Math.max(PPS-3,(e-s)*PPS-3))+'px';
}

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  dragState.curSlot = yToSlot(dragState.colEl, e.clientY, dragState.segSlots);
  updatePreview();
});
document.addEventListener('touchmove', e => {
  if (!dragState) return;
  dragState.curSlot = yToSlot(dragState.colEl, e.touches[0].clientY, dragState.segSlots);
  updatePreview();
}, {passive:true});

function endDrag() {
  if (!dragState) return;
  const sLocal = Math.min(dragState.startSlot, dragState.curSlot);
  const eRawLocal = Math.max(dragState.startSlot, dragState.curSlot);
  const eLocal = eRawLocal === sLocal ? sLocal+1 : eRawLocal;
  const colInfo = dragState.colInfo;
  const baseSlot = dragState.baseSlot;
  if (previewEl) { previewEl.remove(); previewEl = null; }
  dragState = null;

  const startDate = slotToDate(colInfo.dayBase, baseSlot + sLocal);
  const endDate = slotToDate(colInfo.dayBase, baseSlot + eLocal);
  const overlap = bookings.some(b => b.room === colInfo.room &&
    startDate < new Date(b.end_ts) && endDate > new Date(b.start_ts));
  if (overlap) { alert('이미 예약된 시간대와 겹칩니다.'); return; }

  const memoInput = prompt('메모 (선택사항, 예: 구매)');
  if (memoInput === null) return; // 취소 누르면 등록 안 함
  const memo = memoInput.trim().slice(0, 30);
  confirmBooking(colInfo, startDate, endDate, currentUser, memo);
}
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

async function confirmBooking(colInfo, startDate, endDate, userName, memo) {
  const { error } = await sb.from('reservations').insert({
    room: colInfo.room, user_name: userName, memo: memo || null,
    start_ts: startDate.toISOString(), end_ts: endDate.toISOString()
  });
  if (error) {
    alert(error.message.includes('exclude') || error.code === '23P01'
      ? '방금 다른 사람이 같은 시간대를 예약했습니다. 새로고침 후 다시 시도해주세요.'
      : '예약 실패: ' + error.message);
  }
  renderView();
}

// ---------- 실시간 반영 ----------
function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('reservations-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, () => {
      renderView();
    })
    .subscribe();
}

// ---------- 시작 ----------
renderNameScreen();
if (currentUser) showApp();
else document.getElementById('nameScreen').style.display = 'flex';
</script>
