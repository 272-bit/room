<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>회의실 예약</title>
<style>
  :root {
    --navy: #1e3a5f;
    --navy-light: #eaf0f7;
    --border: #dfe3e8;
    --text: #1c1c1e;
    --text-muted: #8a8f98;
    --bg: #f7f8fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 16px 16px 60px; }

  /* 이름 선택 화면 */
  #nameScreen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 24px;
  }
  #nameScreen h1 { font-size: 22px; font-weight: 600; margin: 0; }
  #nameScreen p { color: var(--text-muted); margin: 0; font-size: 15px; }
  .name-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; width: 100%; max-width: 420px; }
  .name-btn {
    padding: 22px 0; border-radius: 14px; border: none; font-size: 20px; font-weight: 600;
    cursor: pointer; color: #fff;
  }

  /* 상단 바 */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .user-pill { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .user-dot { width: 14px; height: 14px; border-radius: 50%; }
  .change-user { font-size: 13px; color: var(--text-muted); background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0; }

  .view-tabs { display: flex; gap: 6px; }
  .view-tab {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    font-size: 15px; cursor: pointer; color: var(--text);
  }
  .view-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  /* 날짜 네비게이션 */
  .nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: #fff;
    font-size: 20px; cursor: pointer; color: var(--text);
  }
  .nav-label { font-size: 18px; font-weight: 600; }

  .room-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .room-tab {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    font-size: 14px; white-space: nowrap; cursor: pointer; color: var(--text);
  }
  .room-tab.active { background: var(--navy-light); border-color: var(--navy); color: var(--navy); font-weight: 600; }

  /* 그리드 */
  .grid-scroll { overflow-x: auto; }
  .grid-wrap { min-width: 100%; }
  .col-headers { display: grid; margin-bottom: 4px; }
  .col-header { text-align: center; font-size: 15px; font-weight: 600; padding: 6px 4px; color: var(--text); }
  .col-header .sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .grid-body { display: grid; position: relative; }
  .time-col { position: relative; }
  .time-label { position: absolute; right: 8px; font-size: 13px; color: var(--text-muted); transform: translateY(-50%); }

  .day-col {
    position: relative; border-left: 1px solid var(--border); border-top: 1px solid var(--border);
    touch-action: none; background-color: #fff;
  }
  .day-col:last-child { border-right: 1px solid var(--border); }

  .booking-bar {
    position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 4px 8px;
    font-size: 13px; font-weight: 600; overflow: hidden; line-height: 1.35; cursor: pointer;
  }
  .booking-bar .time { display: block; font-size: 11px; font-weight: 400; opacity: 0.85; }

  .preview-bar {
    position: absolute; left: 3px; right: 3px; border: 2px dashed var(--navy); border-radius: 6px;
    pointer-events: none; background: rgba(30,58,95,0.08);
  }

  .pending-panel {
    margin-top: 16px; padding: 16px; background: #fff; border: 1px solid var(--border); border-radius: 12px;
  }
  .pending-panel .label { font-size: 15px; margin: 0 0 10px; }
  .pending-names { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .pending-names button {
    padding: 10px 18px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff;
  }
  .pending-cancel { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; }

  .hint { font-size: 13px; color: var(--text-muted); margin-top: 14px; }
</style>
</head>
<body>

<div id="nameScreen" style="display:none;">
  <h1>회의실 예약</h1>
  <p>본인 이름을 선택하세요</p>
  <div class="name-grid" id="nameGrid"></div>
</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="user-pill">
      <span class="user-dot" id="userDot"></span>
      <span id="userLabel"></span>
      <button class="change-user" id="changeUserBtn">변경</button>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" data-view="day">일간</button>
      <button class="view-tab" data-view="week">주간</button>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">‹</button>
    <div class="nav-label" id="navLabel"></div>
    <button class="nav-btn" id="nextBtn">›</button>
  </div>

  <div id="roomTabsWrap" class="room-tabs" style="display:none;"></div>

  <div class="grid-scroll">
    <div class="grid-wrap">
      <div class="col-headers" id="colHeaders"></div>
      <div class="grid-body" id="gridBody"></div>
    </div>
  </div>

  <div class="pending-panel" id="pendingPanel" style="display:none;">
    <p class="label" id="pendingLabel"></p>
    <div class="pending-names" id="pendingNames"></div>
    <button class="pending-cancel" id="pendingCancel">취소</button>
  </div>

  <p class="hint">빈 공간을 눌러서 아래로 끌면 시간대가 선택됩니다 (30분 단위). 예약 막대를 누르면 취소할 수 있습니다.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== 여기 두 값만 채우세요 (Supabase 프로젝트 설정 > API) ======
const SUPABASE_URL = 'https://bkxdmkvcckawdprhjctd.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'sb_publishable_YGr6WQNo4I8GOFb_VnFfbQ_XsfR-vEr';
// ================================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const START_HOUR = 8;
const END_HOUR = 20;
const TOTAL_SLOTS = (END_HOUR - START_HOUR) * 2; // 30분 단위
const PPS = 28; // pixels per slot
const GRID_HEIGHT = TOTAL_SLOTS * PPS;

const USERS = [
  { name: 'KJ', bg: '#7F77DD', fg: '#ffffff' },
  { name: 'YG', bg: '#1D9E75', fg: '#ffffff' },
  { name: 'JH', bg: '#D85A30', fg: '#ffffff' },
  { name: 'JR', bg: '#D4537E', fg: '#ffffff' },
  { name: 'HK', bg: '#5F5E5A', fg: '#ffffff' },
  { name: 'SY', bg: '#378ADD', fg: '#ffffff' },
];
const ROOMS = [
  { key: '대회의실', label: '대회의실', sub: '' },
  { key: '접견실', label: '접견실', sub: '' },
  { key: '회의실1', label: '회의실1', sub: '영업 앞' },
  { key: '회의실2', label: '회의실2', sub: '접견실 옆' },
];

function userInfo(name) { return USERS.find(u => u.name === name); }

// ---------- 상태 ----------
let currentUser = localStorage.getItem('roomBookingUser') || null;
let view = 'day'; // 'day' | 'week'
let currentDate = new Date();
let currentRoomIdx = 0; // 주간 뷰에서 선택된 회의실
let bookings = []; // 현재 조회 범위의 예약 목록 (room, start_ts, end_ts, user_name, id)
let realtimeChannel = null;

// ---------- 유틸 ----------
function startOfDay(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d) { // 월요일 시작
  const x = startOfDay(d);
  const day = (x.getDay() + 6) % 7; // 월=0
  return addDays(x, -day);
}
function slotToLabel(slot) {
  const totalMin = START_HOUR*60 + slot*30;
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function dateToSlot(dateObj, dayBase) {
  const diffMs = dateObj - dayBase;
  const min = diffMs/60000 - START_HOUR*60;
  return min/30;
}
function slotToDate(dayBase, slot) {
  const totalMin = START_HOUR*60 + slot*30;
  return new Date(dayBase.getTime() + totalMin*60000);
}
function fmtDateLabel(d) {
  return new Intl.DateTimeFormat('ko-KR', { month:'long', day:'numeric', weekday:'short' }).format(d);
}

// ---------- 이름 선택 ----------
function renderNameScreen() {
  const grid = document.getElementById('nameGrid');
  grid.innerHTML = '';
  USERS.forEach(u => {
    const b = document.createElement('button');
    b.className = 'name-btn';
    b.textContent = u.name;
    b.style.background = u.bg;
    b.onclick = () => {
      localStorage.setItem('roomBookingUser', u.name);
      currentUser = u.name;
      showApp();
    };
    grid.appendChild(b);
  });
}

function showApp() {
  document.getElementById('nameScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const u = userInfo(currentUser);
  document.getElementById('userDot').style.background = u.bg;
  document.getElementById('userLabel').textContent = currentUser + '님';
  renderView();
  subscribeRealtime();
}

document.getElementById('changeUserBtn').onclick = () => {
  localStorage.removeItem('roomBookingUser');
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('nameScreen').style.display = 'flex';
};

// ---------- 뷰 전환 ----------
document.querySelectorAll('.view-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    view = tab.dataset.view;
    document.getElementById('roomTabsWrap').style.display = view === 'week' ? 'flex' : 'none';
    renderView();
  };
});

function renderRoomTabs() {
  const wrap = document.getElementById('roomTabsWrap');
  wrap.innerHTML = '';
  ROOMS.forEach((r, idx) => {
    const b = document.createElement('button');
    b.className = 'room-tab' + (idx === currentRoomIdx ? ' active' : '');
    b.textContent = r.label + (r.sub ? ' (' + r.sub + ')' : '');
    b.onclick = () => { currentRoomIdx = idx; renderView(); };
    wrap.appendChild(b);
  });
}

// ---------- 네비게이션 ----------
document.getElementById('prevBtn').onclick = () => { navigate(-1); };
document.getElementById('nextBtn').onclick = () => { navigate(1); };
function navigate(dir) {
  if (view === 'day') currentDate = addDays(currentDate, dir);
  else currentDate = addDays(currentDate, dir*7);
  renderView();
}

// 스와이프 (그리드 영역 전체, 가로 이동이 우세할 때만 네비게이션으로 처리)
(function setupSwipe(){
  const scrollEl = document.querySelector('.grid-scroll');
  let sx=0, sy=0, tracking=false, decided=null;
  scrollEl.addEventListener('touchstart', e => {
    if (dragState) return; // 예약 드래그 중이면 스와이프 무시
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true; decided = null;
  }, {passive:true});
  scrollEl.addEventListener('touchmove', e => {
    if (!tracking || dragState) return;
    const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (decided === null && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
      decided = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
  }, {passive:true});
  scrollEl.addEventListener('touchend', e => {
    if (!tracking || dragState) { tracking = false; return; }
    const dx = (e.changedTouches[0].clientX - sx);
    if (decided === 'h' && Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
    tracking = false;
  });
})();

// ---------- 렌더링 ----------
function renderView() {
  renderRoomTabs();
  const label = view === 'day'
    ? fmtDateLabel(currentDate)
    : (() => {
        const s = startOfWeek(currentDate), e = addDays(s, 6);
        return fmtDateLabel(s) + ' ~ ' + fmtDateLabel(e);
      })();
  document.getElementById('navLabel').textContent = label;

  const columns = view === 'day'
    ? ROOMS.map(r => ({ key: r.key, title: r.label, sub: r.sub, dayBase: startOfDay(currentDate), room: r.key }))
    : (() => {
        const s = startOfWeek(currentDate);
        const room = ROOMS[currentRoomIdx].key;
        return [0,1,2,3,4,5,6].map(i => {
          const d = addDays(s, i);
          return { key: room+'-'+i, title: fmtDateLabel(d).split(' ').slice(0,2).join(' '), sub: fmtDateLabel(d).split(' ')[2]||'', dayBase: d, room };
        });
      })();

  // 헤더
  const colHeaders = document.getElementById('colHeaders');
  colHeaders.style.gridTemplateColumns = '56px repeat('+columns.length+', minmax(90px, 1fr))';
  colHeaders.innerHTML = '<div></div>' + columns.map(c =>
    '<div class="col-header">'+c.title+(c.sub ? '<span class="sub"><br>'+c.sub+'</span>' : '')+'</div>'
  ).join('');

  // 바디
  const gridBody = document.getElementById('gridBody');
  gridBody.style.gridTemplateColumns = '56px repeat('+columns.length+', minmax(90px, 1fr))';
  gridBody.innerHTML = '';

  const timeCol = document.createElement('div');
  timeCol.className = 'time-col';
  timeCol.style.height = GRID_HEIGHT + 'px';
  for (let h = START_HOUR; h <= END_HOUR; h++) {
    const slot = (h - START_HOUR) * 2;
    const lab = document.createElement('div');
    lab.className = 'time-label';
    lab.style.top = (slot*PPS) + 'px';
    lab.textContent = String(h).padStart(2,'0') + ':00';
    timeCol.appendChild(lab);
  }
  gridBody.appendChild(timeCol);

  columns.forEach(col => {
    const div = document.createElement('div');
    div.className = 'day-col';
    div.style.height = GRID_HEIGHT + 'px';
    div.style.backgroundImage = 'repeating-linear-gradient(to bottom, var(--border) 0 1px, transparent 1px '+(PPS*2)+'px)';
    div.dataset.room = col.room;
    div.dataset.daybase = col.dayBase.getTime();
    gridBody.appendChild(div);
    attachDragHandlers(div, col);
  });

  fetchAndRenderBookings(columns);
}

// ---------- 데이터 조회 ----------
async function fetchAndRenderBookings(columns) {
  let rangeStart, rangeEnd, roomFilter = null;
  if (view === 'day') {
    rangeStart = startOfDay(currentDate);
    rangeEnd = addDays(rangeStart, 1);
  } else {
    rangeStart = startOfWeek(currentDate);
    rangeEnd = addDays(rangeStart, 7);
    roomFilter = ROOMS[currentRoomIdx].key;
  }
  let query = supabase.from('reservations').select('*')
    .lt('start_ts', rangeEnd.toISOString())
    .gt('end_ts', rangeStart.toISOString());
  if (roomFilter) query = query.eq('room', roomFilter);

  const { data, error } = await query;
  if (error) { console.error(error); bookings = []; }
  else bookings = data || [];
  renderBookingBars(columns);
}

function renderBookingBars(columns) {
  document.querySelectorAll('.day-col').forEach(colEl => {
    colEl.querySelectorAll('.booking-bar').forEach(el => el.remove());
    const room = colEl.dataset.room;
    const dayBase = new Date(Number(colEl.dataset.daybase));
    const dayEnd = addDays(dayBase, 1);
    bookings
      .filter(b => b.room === room)
      .forEach(b => {
        const s = new Date(b.start_ts), e = new Date(b.end_ts);
        if (e <= dayBase || s >= dayEnd) return; // 이 컬럼(날짜) 범위 밖
        const startSlot = Math.max(0, dateToSlot(s < dayBase ? dayBase : s, dayBase));
        const endSlot = Math.min(TOTAL_SLOTS, dateToSlot(e > dayEnd ? dayEnd : e, dayBase));
        const u = userInfo(b.user_name);
        const bar = document.createElement('div');
        bar.className = 'booking-bar';
        bar.style.top = (startSlot*PPS) + 'px';
        bar.style.height = Math.max(PPS-3, (endSlot-startSlot)*PPS-3) + 'px';
        bar.style.background = u.bg;
        bar.style.color = u.fg;
        bar.innerHTML = u.name + '<span class="time">'+ fmtTime(s) +'-'+ fmtTime(e) +'</span>';
        bar.onclick = (ev) => {
          ev.stopPropagation();
          if (confirm(u.name+'님의 예약을 취소할까요? ('+fmtTime(s)+'-'+fmtTime(e)+', '+room+')')) {
            deleteBooking(b.id);
          }
        };
        colEl.appendChild(bar);
      });
  });
}
function fmtTime(d) { return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

async function deleteBooking(id) {
  const { error } = await supabase.from('reservations').delete().eq('id', id);
  if (error) alert('삭제 실패: ' + error.message);
  renderView();
}

// ---------- 드래그로 예약 생성 ----------
let dragState = null;
let previewEl = null;

function yToSlot(el, clientY) {
  const rect = el.getBoundingClientRect();
  const y = clientY - rect.top;
  return Math.max(0, Math.min(TOTAL_SLOTS, Math.round(y / PPS)));
}

function attachDragHandlers(colEl, colInfo) {
  const start = (clientY) => {
    const slot = yToSlot(colEl, clientY);
    dragState = { colEl, colInfo, startSlot: slot, curSlot: slot };
    previewEl = document.createElement('div');
    previewEl.className = 'preview-bar';
    colEl.appendChild(previewEl);
    updatePreview();
  };
  colEl.addEventListener('mousedown', e => { if (e.target === colEl) start(e.clientY); });
  colEl.addEventListener('touchstart', e => { if (e.target === colEl) start(e.touches[0].clientY); }, {passive:true});
}

function updatePreview() {
  if (!dragState || !previewEl) return;
  const s = Math.min(dragState.startSlot, dragState.curSlot);
  const eRaw = Math.max(dragState.startSlot, dragState.curSlot);
  const e = eRaw === s ? s+1 : eRaw;
  previewEl.style.top = (s*PPS)+'px';
  previewEl.style.height = (Math.max(PPS-3,(e-s)*PPS-3))+'px';
}

document.addEventListener('mousemove', e => {
  if (!dragState) return;
  dragState.curSlot = yToSlot(dragState.colEl, e.clientY);
  updatePreview();
});
document.addEventListener('touchmove', e => {
  if (!dragState) return;
  dragState.curSlot = yToSlot(dragState.colEl, e.touches[0].clientY);
  updatePreview();
}, {passive:true});

function endDrag() {
  if (!dragState) return;
  const s = Math.min(dragState.startSlot, dragState.curSlot);
  const eRaw = Math.max(dragState.startSlot, dragState.curSlot);
  const e = eRaw === s ? s+1 : eRaw;
  const colInfo = dragState.colInfo;
  if (previewEl) { previewEl.remove(); previewEl = null; }
  dragState = null;

  const startDate = slotToDate(colInfo.dayBase, s);
  const endDate = slotToDate(colInfo.dayBase, e);
  const overlap = bookings.some(b => b.room === colInfo.room &&
    startDate < new Date(b.end_ts) && endDate > new Date(b.start_ts));
  if (overlap) { alert('이미 예약된 시간대와 겹칩니다.'); return; }

  showPending(colInfo, startDate, endDate);
}
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

function showPending(colInfo, startDate, endDate) {
  const panel = document.getElementById('pendingPanel');
  panel.style.display = 'block';
  const roomLabel = ROOMS.find(r => r.key === colInfo.room).label;
  document.getElementById('pendingLabel').textContent =
    roomLabel + ' · ' + fmtDateLabel(startDate) + ' ' + fmtTime(startDate) + '-' + fmtTime(endDate);

  const namesWrap = document.getElementById('pendingNames');
  namesWrap.innerHTML = '';
  // 본인 이름 버튼을 앞에 강조 배치
  const ordered = [userInfo(currentUser), ...USERS.filter(u => u.name !== currentUser)];
  ordered.forEach(u => {
    const b = document.createElement('button');
    b.textContent = u.name === currentUser ? (u.name + ' (나)') : u.name;
    b.style.background = u.bg;
    b.onclick = () => confirmBooking(colInfo, startDate, endDate, u.name);
    namesWrap.appendChild(b);
  });
}
document.getElementById('pendingCancel').onclick = () => {
  document.getElementById('pendingPanel').style.display = 'none';
};

async function confirmBooking(colInfo, startDate, endDate, userName) {
  const { error } = await supabase.from('reservations').insert({
    room: colInfo.room, user_name: userName,
    start_ts: startDate.toISOString(), end_ts: endDate.toISOString()
  });
  document.getElementById('pendingPanel').style.display = 'none';
  if (error) {
    alert(error.message.includes('exclude') || error.code === '23P01'
      ? '방금 다른 사람이 같은 시간대를 예약했습니다. 새로고침 후 다시 시도해주세요.'
      : '예약 실패: ' + error.message);
  }
  renderView();
}

// ---------- 실시간 반영 ----------
function subscribeRealtime() {
  if (realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel = supabase.channel('reservations-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, () => {
      renderView();
    })
    .subscribe();
}

// ---------- 시작 ----------
renderNameScreen();
if (currentUser) showApp();
else document.getElementById('nameScreen').style.display = 'flex';
</script>
